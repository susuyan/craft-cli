name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: arm64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        rustup target add ${{ matrix.target }}

    - name: Build release binary
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Package binary
      run: |
        cd target/${{ matrix.target }}/release
        tar czf craft-cli-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz craft-cli
        shasum -a 256 craft-cli-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz > craft-cli-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz.sha256

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/${{ matrix.target }}/release/craft-cli-*.tar.gz
          target/${{ matrix.target }}/release/craft-cli-*.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout homebrew tap
      uses: actions/checkout@v4
      with:
        repository: susuyan/homebrew-susuyan
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    - name: Download release assets
      run: |
        curl -L -o craft-cli-arm64.tar.gz "https://github.com/susuyan/craft-cli/releases/download/${{ github.ref_name }}/craft-cli-${{ github.ref_name }}-arm64-apple-darwin.tar.gz"
        curl -L -o craft-cli-x86_64.tar.gz "https://github.com/susuyan/craft-cli/releases/download/${{ github.ref_name }}/craft-cli-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz"

    - name: Calculate SHA256
      run: |
        ARM64_SHA=$(shasum -a 256 craft-cli-arm64.tar.gz | cut -d ' ' -f 1)
        X86_64_SHA=$(shasum -a 256 craft-cli-x86_64.tar.gz | cut -d ' ' -f 1)
        VERSION=${{ github.ref_name }}

        cat > craft-cli.rb << 'FORMULA_EOF'
class CraftCli < Formula
  desc "Craft.do API CLI for AI Agents"
  homepage "https://github.com/susuyan/craft-cli"
  version "VERSION_PLACEHOLDER"

  on_arm do
    url "https://github.com/susuyan/craft-cli/releases/download/VERSION_PLACEHOLDER/craft-cli-VERSION_PLACEHOLDER-arm64-apple-darwin.tar.gz"
    sha256 "ARM64_SHA_PLACEHOLDER"
  end

  on_intel do
    url "https://github.com/susuyan/craft-cli/releases/download/VERSION_PLACEHOLDER/craft-cli-VERSION_PLACEHOLDER-x86_64-apple-darwin.tar.gz"
    sha256 "X86_64_SHA_PLACEHOLDER"
  end

  def install
    bin.install "craft-cli"
  end

  test do
    system "#{bin}/craft-cli", "--version"
  end
end
FORMULA_EOF

        # Replace placeholders with actual values
        sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" craft-cli.rb
        sed -i "s/ARM64_SHA_PLACEHOLDER/${ARM64_SHA}/g" craft-cli.rb
        sed -i "s/X86_64_SHA_PLACEHOLDER/${X86_64_SHA}/g" craft-cli.rb

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add craft-cli.rb
        git commit -m "Update formula to ${{ github.ref_name }}"
        git push
